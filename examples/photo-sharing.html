<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one stage-column diagram on top, the chosen path's narration underneath; tabs pick the path. */
  :root {
    --bg: #f6f8f9;
    --surface: #ffffff;
    --ink: #142029;
    --muted: #4c5a65;
    --line: #c3cdd4;
    --edge: #93a1ab;
    --rail: #f1f5f7;
    --all: #46545f;
    --c-green: #0b7a62;
    --c-rose: #b4365f;
    --c-blue: #2459b8;
    --c-amber: #a35f00;
    --c-violet: #6a43b8;
    --c-teal: #0a7387;
    --dim: 0.16;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161b; --surface: #182129; --ink: #e6ecef; --muted: #98a6b0; --line: #34424d; --edge: #4d5d69; --rail: #1d2830;
      --all: #a9b6bf; --c-green: #3cc39f; --c-rose: #ee7aa0; --c-blue: #7aa6f2; --c-amber: #e6a64a; --c-violet: #b39af0; --c-teal: #4cc4d4;
      --dim: 0.2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161b; --surface: #182129; --ink: #e6ecef; --muted: #98a6b0; --line: #34424d; --edge: #4d5d69; --rail: #1d2830;
    --all: #a9b6bf; --c-green: #3cc39f; --c-rose: #ee7aa0; --c-blue: #7aa6f2; --c-amber: #e6a64a; --c-violet: #b39af0; --c-teal: #4cc4d4;
    --dim: 0.2; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
    padding-inline: 16px; padding-block: 28px 48px;
  }
  .wrap { position: relative; max-width: 1240px; margin-inline: auto; display: grid; gap: 20px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; padding-right: 90px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; }
  .lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }

  /* A quiet switch in the corner, kept apart from the path tabs. */
  .theme {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 13px/1 var(--font-body); color: var(--muted);
    background: transparent; border: 0; border-radius: 8px; padding: 6px 4px; cursor: pointer;
  }
  .theme:hover { color: var(--ink); }
  .theme:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  .track { position: relative; width: 34px; height: 18px; border-radius: 999px; background: var(--rail); box-shadow: inset 0 0 0 1px var(--line); }
  .knob {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    display: grid; place-items: center; transition: transform 0.2s ease;
  }
  .theme[aria-pressed="true"] .knob { transform: translateX(16px); background: var(--edge); }
  .ic { grid-area: 1 / 1; width: 10px; height: 10px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }
  .ic.moon { fill: var(--muted); stroke: none; }
  .theme[aria-pressed="true"] .ic.moon { fill: var(--ink); }
  .theme[aria-pressed="true"] .sun, .theme[aria-pressed="false"] .moon { display: none; }
  @media (prefers-reduced-motion: reduce) { .knob { transition: none; } }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    --c: var(--all);
    font: 600 14px/1 var(--font-body); color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 14px 9px 12px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .tab::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .tab[aria-selected="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
  .tab:hover { border-color: var(--c); }
  .tab:focus-visible, .ctl:focus-visible, .step:focus-visible { outline: 2px solid var(--c, var(--pc)); outline-offset: 2px; }

  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
  #dia { display: block; width: 100%; height: auto; }

  .col-band { fill: var(--rail); }
  .col-head { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }

  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke 0.3s, opacity 0.3s; }
  .node.style-dashed rect { stroke-dasharray: 5 4; }
  .node.style-strong rect { stroke: var(--muted); }
  .node .nl { font-family: var(--font-display); font-weight: 600; font-size: 15px; fill: var(--ink); }
  .node .ns { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
  .node, .edge, .elabel { transition: opacity 0.35s; }
  .node.dim, .edge.dim, .elabel.dim { opacity: var(--dim); }
  .node.on rect { stroke: var(--pc); stroke-width: 2; }
  .node.now rect { stroke: var(--pc); stroke-width: 3; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
  .edge.on { stroke: var(--pc); stroke-opacity: 0.45; }
  .edge.now { stroke: var(--pc); stroke-opacity: 1; stroke-width: 2.6; }
  .elabel text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
  .elabel.now text { fill: var(--pc); font-weight: 500; }
  .comet { pointer-events: none; }

  .panel { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .panel { grid-template-columns: minmax(0, 1fr); } }

  .now-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 10px; min-width: 0; }
  .now-meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pc); margin: 0; }
  .now-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
  .now-text { margin: 0; max-width: 62ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .ctl {
    font: 600 13.5px/1 var(--font-body); color: var(--ink); background: transparent;
    border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 13px; cursor: pointer;
  }
  .ctl.primary { background: var(--pc); border-color: var(--pc); color: var(--surface); }
  .ctl:hover { border-color: var(--pc); }
  .ctl[disabled] { opacity: 0.4; cursor: default; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; min-width: 0; }
  .step {
    counter-increment: s; width: 100%; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline;
    background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px;
    font: 500 14px/1.4 var(--font-body); color: var(--muted);
  }
  .step::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .step:hover { border-color: var(--line); color: var(--ink); }
  .step[aria-current="step"] { background: var(--surface); border-color: var(--pc); color: var(--ink); }
  .step[aria-current="step"]::before { color: var(--pc); }
  .step.done { color: var(--ink); }

  .overview { display: grid; grid-template-columns: repeat(var(--ov-cols, 3), minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 820px) { .overview { grid-template-columns: minmax(0, 1fr); } }
  .ov { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
  .ov h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .ov h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .ov p { margin: 0; color: var(--muted); }
  .ov .ctl { justify-self: start; --pc: var(--c); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface); }
  .sw.style-strong { border-color: var(--muted); }
  .sw.style-dashed { border-style: dashed; }
  /* The corner controls: presentation mode and the theme switch, kept apart from the path tabs. */
  .corner { position: absolute; top: -8px; right: 0; display: flex; align-items: center; gap: 14px; z-index: 2; }
  .pic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .eyebrow { padding-right: 200px; }

  /* Presenting: the diagram fills the screen; only the title, tabs and the current step stay. */
  html.presenting body { height: 100dvh; overflow: hidden; padding-block: 14px; }
  .presenting .wrap { max-width: none; height: 100%; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
  .presenting header { padding-top: 26px; }
  .presenting h1 { font-size: 26px; }
  .presenting .eyebrow, .presenting .lede, .presenting .legend, .presenting .overview, .presenting .steps { display: none !important; }
  .presenting .stage { min-height: 0; display: flex; }
  .presenting .passport { max-height: calc(100% - 24px); }
  .presenting #dia { width: 100%; height: 100%; min-width: 0 !important; max-width: none !important; }
  .presenting #walk { grid-template-columns: minmax(0, 1fr); }
  .presenting .now-card { padding: 14px 20px; gap: 6px; }
  .presenting .now-title { font-size: 21px; }
  .presenting .now-text { max-width: 110ch; }
  /* Clicking a box zooms the diagram onto it and its connections, and opens its detail card. */
  .stage { position: relative; }
  .node { cursor: pointer; outline: none; }
  .node.focus rect { stroke: var(--ink); stroke-width: 3; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ink) 35%, transparent)); }
  .node:focus-visible rect { stroke: var(--ink); stroke-width: 2.5; }
  .node.fdim, .edge.fdim, .elabel.fdim { opacity: var(--dim); }
  /* While a card is open, its highlighting replaces the path tab's: the box and its connections show in full. */
  #dia.focusing .node.dim:not(.fdim), #dia.focusing .edge.dim:not(.fdim), #dia.focusing .elabel.dim:not(.fdim) { opacity: 1; }
  .passport {
    position: absolute; z-index: 3; width: min(320px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); padding: 16px 18px; display: grid; gap: 10px;
  }
  .pp-grip { height: 14px; margin: -10px -18px -4px; cursor: grab; touch-action: none; display: grid; place-items: center; }
  .pp-grip::before { content: ""; width: 28px; height: 4px; background: radial-gradient(circle, var(--muted) 1px, transparent 1.4px) 0 0 / 5px 4px repeat-x; opacity: 0.7; }
  .passport.dragging, .passport.dragging .pp-grip { cursor: grabbing; user-select: none; }
  .pp-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
  .pp-kind { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .pp-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; margin: 2px 0 0; }
  .pp-sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin: 0; }
  .pp-desc { margin: 0; font-size: 14px; }
  .pp-close { background: transparent; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .pp-close:hover { color: var(--ink); }
  .pp-sec { display: grid; gap: 4px; }
  .pp-sec h4 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
  .pp-link {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-radius: 6px; padding: 3px 6px; margin-left: -6px;
    font: 14px/1.35 var(--font-body); color: var(--ink);
  }
  .pp-link:hover { background: var(--rail); }
  .pp-link span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .pp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pp-chip { --c: var(--all); font: 600 12.5px/1 var(--font-body); color: var(--ink); background: transparent; border: 1.5px solid var(--c); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .pp-chip:hover { background: var(--rail); }
  .pp-close:focus-visible, .pp-link:focus-visible, .pp-chip:focus-visible { outline: 2px solid var(--muted); outline-offset: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="corner">
    <button class="theme" id="present" type="button" aria-pressed="false" title="Present full screen (F)">
      <svg class="pic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg><span id="present-label">Present</span>
    </button>
  <button class="theme" id="theme" type="button" aria-label="Dark mode" aria-pressed="false">
      <span class="track"><span class="knob"><svg class="ic sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg><svg class="ic moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg></span></span><span id="theme-label">Light</span>
    </button>
  </div>
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Choose a path"></div>
  </header>

  <div class="stage">
    <svg id="dia" role="img">
      <g id="bands"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="labels"></g>
      <g id="comets"></g>
    </svg>
    <div class="passport" id="passport" role="dialog" aria-labelledby="pp-title" hidden>
      <div class="pp-grip" id="pp-grip" title="Drag to move"></div>
      <div class="pp-head">
        <div>
          <p class="pp-kind" id="pp-kind"></p>
          <h3 class="pp-title" id="pp-title"></h3>
        </div>
        <button class="pp-close" id="pp-close" type="button" aria-label="Close details">&times;</button>
      </div>
      <p class="pp-sub" id="pp-sub"></p>
      <p class="pp-desc" id="pp-desc"></p>
      <div class="pp-sec" id="pp-in"><h4>Receives from</h4></div>
      <div class="pp-sec" id="pp-out"><h4>Sends to</h4></div>
      <div class="pp-sec" id="pp-paths"><h4>Part of</h4><div class="pp-chips" id="pp-chips"></div></div>
    </div>
  </div>

  <div class="legend" id="legend" aria-label="Legend"></div>

  <section id="overview" class="overview" aria-label="The paths"></section>

  <section id="walk" class="panel" hidden>
    <div class="now-card">
      <p class="now-meta" id="now-meta"></p>
      <h2 class="now-title" id="now-title"></h2>
      <p class="now-text" id="now-text"></p>
      <div class="controls">
        <button class="ctl" id="prev">Previous</button>
        <button class="ctl primary" id="play">Pause</button>
        <button class="ctl" id="next">Next</button>
      </div>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>
</div>

<script>
(() => {
  const spec = {"title":"How a photo travels","pageTitle":"Photo Paths","eyebrow":"Example · photo sharing","lede":"Three paths through one photo service: uploading a photo, sharing it with a friend, and the friend opening it.","columns":[{"label":"Phone"},{"label":"Front door"},{"label":"Checks"},{"label":"Stored"},{"label":"Viewing"}],"kinds":[{"id":"device","label":"On someone's phone","style":"strong"},{"id":"ours","label":"Run by the photo service","style":"solid"},{"id":"partner","label":"Run by an outside company","style":"dashed"}],"nodes":{"app":{"column":0,"row":1,"label":"Photo app","sub":"the owner's phone","kind":"device","description":"The owner's photo app. It takes the photo, uploads it, and is where the owner decides who to share it with."},"upload":{"column":1,"row":1,"label":"Upload API","sub":"signed requests","kind":"ours","description":"The service's front door. Every request from an app is signed, so the service knows which account it comes from."},"scanner":{"column":2,"row":0,"label":"Safety scan","sub":"malware · abuse","kind":"partner","description":"An outside safety service. It checks each new file for malware and abuse before anything else touches it."},"resizer":{"column":2,"row":2,"label":"Resizer","sub":"thumbnails · sizes","kind":"ours","description":"Makes a thumbnail and the sizes screens ask for, so nobody downloads the full original just to see a preview."},"rules":{"column":2,"row":3.4,"label":"Sharing rules","sub":"who may see what","kind":"ours","description":"Records who may see which photo, and until when. Only the owner, through the service, can change them."},"store":{"column":3,"row":1,"label":"Photo store","sub":"originals · sizes","kind":"ours","description":"Keeps each original and its sizes. Nothing in it is visible to anyone until a sharing rule allows it."},"friend":{"column":4,"row":0,"label":"Friend's app","sub":"an invited viewer","kind":"device","description":"The app of someone the owner shared with. It can only ask to see photos; it never changes the rules."},"gateway":{"column":4,"row":2,"label":"View gateway","sub":"check · log","kind":"ours","description":"Every view goes through here. It checks the sharing rules, fetches the right size, and logs who looked."}},"edges":{"send":{"from":"app","to":"upload","label":"upload"},"done":{"from":"upload","to":"app","label":"uploaded"},"scan":{"from":"upload","to":"scanner","label":"scan"},"resize":{"from":"upload","to":"resizer","label":"make sizes"},"save":{"from":"resizer","to":"store","label":"save"},"rule":{"from":"upload","to":"rules","label":"sharing rule","labelAt":0.64},"invite":{"from":"rules","to":"gateway","label":"invite"},"check":{"from":"gateway","to":"rules","label":"allowed?"},"fetch":{"from":"store","to":"gateway","label":"photo"},"open":{"from":"friend","to":"gateway","label":"open photo"},"show":{"from":"gateway","to":"friend","label":"photo"}},"paths":[{"id":"upload","name":"Upload path","tab":"Upload","color":"green","summary":"A photo leaves the phone, is checked, and is stored in every size it will be shown at.","steps":[{"edge":"send","title":"The owner uploads a photo","text":"The app sends the original photo over a signed request, so the service knows which account it belongs to."},{"edge":"scan","title":"The photo is scanned","text":"An outside safety service checks the file for malware and abuse before anything else touches it. A photo that fails is refused."},{"edge":"resize","title":"Smaller sizes are made","text":"The resizer makes a thumbnail and the sizes phones and screens ask for, so nobody downloads the full original to see a preview."},{"edge":"save","title":"Everything is stored","text":"The original and its sizes are stored together. Nothing is shared yet: only the owner can see it."},{"edge":"done","title":"The owner sees it in their album","text":"The app is told the upload finished and shows the photo in the owner's album."}]},{"id":"share","name":"Sharing path","tab":"Share","color":"rose","summary":"Only the owner decides who sees a photo, and that decision is a rule the service enforces.","steps":[{"edge":"send","title":"The owner shares with a friend","label":"share with Sam","text":"In the app, the owner picks a photo and a friend to share it with."},{"edge":"rule","title":"A sharing rule is written","text":"The service records who may see which photo, and until when. The friend's app never writes rules itself."},{"edge":"invite","title":"The gateway learns of the invitation","text":"The view gateway is told there is a new invitation for this friend."},{"edge":"show","title":"The friend is invited","label":"invitation","text":"The friend's app shows the invitation, with the owner's name and a preview."}]},{"id":"view","name":"Viewing path","tab":"View","color":"blue","summary":"Every view is checked against the owner's rules and logged.","steps":[{"edge":"open","title":"The friend opens the photo","text":"The friend taps the invitation. Their app asks the view gateway for the photo."},{"edge":"check","title":"The rule is checked","text":"The gateway asks the sharing rules whether this friend may see this photo now. If the owner removed the share, the answer is no."},{"edge":"fetch","title":"The right size is fetched","text":"The gateway takes the size that fits the friend's screen from the store."},{"edge":"show","title":"The friend sees the photo","text":"The photo is shown, and the view is logged so the owner can see who looked."}]}]};

  const W = 160, H = 62, COL_W = 250, FIRST_X = 120, ROW_H = 95, FIRST_Y = 100;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {

    for (const k in attrs) n.setAttribute(k, attrs[k]);

  $("eyebrow").textContent = spec.eyebrow || "";
  $("eyebrow").hidden = !spec.eyebrow;
  $("title").textContent = spec.title;
  $("lede").textContent = spec.lede || "";
  $("lede").hidden = !spec.lede;
  svg.setAttribute("aria-label", spec.diagramLabel || spec.title);

  // Geometry: columns are evenly spaced; a node sits at an explicit y or on a row.
  const cols = spec.columns.map((c, i) => ({ x: FIRST_X + i * COL_W, label: c.label }));
  const nodes = {};
  for (const id in spec.nodes) {
    const n = spec.nodes[id];
    nodes[id] = { ...n, x: cols[n.column].x, y: n.y != null ? n.y : FIRST_Y + n.row * ROW_H };
  }
  const width = FIRST_X * 2 + (cols.length - 1) * COL_W;
  const height = Math.max(...Object.values(nodes).map(n => n.y)) + H / 2 + 70;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.style.minWidth = `${Math.max(560, cols.length * 180)}px`;
  // A diagram with few columns stays at its natural size instead of stretching its text.
  svg.style.maxWidth = `${width}px`;
  svg.style.marginInline = "auto";

  // A path's colour comes from the palette; tabs, cards and comets all read it from one variable.
  const paths = {};
  for (const p of spec.paths) {
    paths[p.id] = p;
    root.style.setProperty(`--p-${p.id}`, `var(--c-${p.color})`);
  }
  const colorOf = id => getComputedStyle(root).getPropertyValue(`--c-${paths[id].color}`).trim();

  // Stage columns, banded alternately so neighbouring stages read apart.
  cols.forEach((c, i) => {
    if (i % 2 === 0) el("rect", { x: c.x - 118, y: 18, width: 236, height: height - 34, rx: 12, class: "col-band" }, $("bands"));
    el("text", { x: c.x, y: 44, "text-anchor": "middle", class: "col-head" }, $("bands")).textContent = c.label;
  });

  const kinds = {};
  (spec.kinds || []).forEach(k => { kinds[k.id] = k; });
  const nodeEls = {};
  for (const id in nodes) {
    const n = nodes[id];
    const style = n.kind && kinds[n.kind] ? kinds[n.kind].style || "solid" : "solid";
    const g = el("g", { class: `node style-${style}`, "data-id": id, tabindex: 0, role: "button", "aria-label": `${n.label}: details` }, $("nodes"));
    el("rect", { x: n.x - W / 2, y: n.y - H / 2, width: W, height: H, rx: 10 }, g);
    el("text", { x: n.x, y: n.sub ? n.y - 4 : n.y + 5, "text-anchor": "middle", class: "nl" }, g).textContent = n.label;
    if (n.sub) el("text", { x: n.x, y: n.y + 15, "text-anchor": "middle", class: "ns" }, g).textContent = n.sub;
    nodeEls[id] = g;
  }

  const legend = $("legend");
  (spec.kinds || []).forEach(k => {
    const s = html("span", {}, legend);
    html("i", { className: `sw style-${k.style || "solid"}` }, s);
    s.append(k.label);
  });
  legend.hidden = !(spec.kinds || []).length;

  // An edge whose reverse also exists is offset sideways, so the two directions don't overlap.
  const edges = {};
  const keyOf = (a, b) => `${a}>${b}`;
  const directions = new Set(Object.values(spec.edges).map(e => keyOf(e.from, e.to)));
  for (const id in spec.edges) {
    const e = spec.edges[id];
    edges[id] = { ...e, o: e.offset != null ? e.offset : directions.has(keyOf(e.to, e.from)) ? -9 : 0 };
  }

  // Edges leave from the side facing the target, curve, and arrive at the facing side.
  el("defs", {}, svg).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>`;
  const edgeEls = {};
  for (const id in edges) {
    const e = edges[id], a = nodes[e.from], b = nodes[e.to], o = e.o;
    const dx = b.x - a.x, dy = b.y - a.y;
    const horiz = Math.abs(dx) > Math.abs(dy) * 0.6;
    let p1, p2, c1, c2;
    if (horiz) {
      const s = Math.sign(dx);
      // The offset is keyed on direction, so the two edges of a pair split to opposite sides.
      const off = o * s;
      p1 = [a.x + s * W / 2, a.y + off];
      p2 = [b.x - s * W / 2, b.y + off];
      const k = Math.abs(p2[0] - p1[0]) * 0.5;
      c1 = [p1[0] + s * k, p1[1]]; c2 = [p2[0] - s * k, p2[1]];
    } else {
      const s = Math.sign(dy);
      const off = -o * s;
      p1 = [a.x + off, a.y + s * H / 2];
      p2 = [b.x + off, b.y - s * H / 2];
      const k = Math.abs(p2[1] - p1[1]) * 0.5;
      c1 = [p1[0], p1[1] + s * k]; c2 = [p2[0], p2[1] - s * k];
    }
    const path = el("path", { d: `M${p1} C${c1} ${c2} ${p2}`, class: "edge", "marker-end": "url(#ah)" }, $("edges"));
    const len = path.getTotalLength();
    // Where along the edge its label sits; the middle unless the edge says otherwise.
    const at = path.getPointAtLength(len * (e.labelAt != null ? e.labelAt : 0.5));
    const lg = el("g", { class: "elabel" }, $("labels"));
    let lx = at.x, ly = at.y, anchor = "middle";
    if (horiz) {
      // A straight edge between two boxes at one height has no room beside it, so its label goes
      // above both; a curved one is labelled just above its middle.
      if (o) ly += o * Math.sign(dx) < 0 ? -10 : 18;
      else if (Math.abs(dy) < H / 2) ly = Math.min(a.y, b.y) - H / 2 - 10;
      else {
        // Where the curve runs steeply at the label, the label sits beside it rather than across it.
        const t = e.labelAt != null ? e.labelAt : 0.5;
        const p0 = path.getPointAtLength(len * Math.max(0, t - 0.04)), q0 = path.getPointAtLength(len * Math.min(1, t + 0.04));
        if (Math.abs(q0.y - p0.y) > Math.abs(q0.x - p0.x)) { lx += 10; anchor = "start"; ly += 4; }
        else ly -= 9;
      }
    } else {
      const side = o ? (-o * Math.sign(dy) < 0 ? -1 : 1) : 1;
      lx += side * 10; anchor = side < 0 ? "end" : "start"; ly += 4;
    }
    const txt = el("text", { x: lx, y: ly, "text-anchor": anchor }, lg);
    txt.textContent = e.label || "";
    edgeEls[id] = { path, len, lg, txt, base: e.label || "" };
  }

  // Which edges and nodes each path touches, for dimming everything else.
  const pathEdges = {}, pathNodes = {};
  for (const id in paths) {
    pathEdges[id] = new Set(paths[id].steps.map(s => s.edge));
    pathNodes[id] = new Set();
    paths[id].steps.forEach(s => { pathNodes[id].add(edges[s.edge].from); pathNodes[id].add(edges[s.edge].to); });
  }

  const tabs = $("tabs");
  const addTab = (id, label, color) => {
    const t = html("button", { className: "tab", id: `tab-${id}`, textContent: label }, tabs);
    t.setAttribute("role", "tab");
    t.dataset.path = id;
    t.style.setProperty("--c", color);
    t.addEventListener("click", () => select(id));
  };
  addTab("all", spec.allLabel || "All paths", "var(--all)");
  for (const id in paths) addTab(id, paths[id].tab || paths[id].name, `var(--p-${id})`);

  const ov = $("overview");
  ov.style.setProperty("--ov-cols", String(Math.min(3, spec.paths.length)));
  for (const id in paths) {
    const card = html("article", { className: "ov" }, ov);
    card.style.setProperty("--c", `var(--p-${id})`);
    html("h2", { textContent: paths[id].name }, card);
    if (paths[id].summary) html("p", { textContent: paths[id].summary }, card);
    const b = html("button", { className: "ctl", id: `walk-${id}`, textContent: `Walk through · ${paths[id].steps.length} steps` }, card);
    b.addEventListener("click", () => select(id));
  }

  let mode = "all", step = 0, playing = !reduced, stepStart = performance.now();
  const STEP_MS = spec.stepSeconds ? spec.stepSeconds * 1000 : 4200, TRAVEL_MS = 1600;

  function paint() {
    root.style.setProperty("--pc", mode === "all" ? "var(--all)" : `var(--p-${mode})`);
    tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.path === mode)));
    ov.hidden = mode !== "all";
    $("walk").hidden = mode === "all";

    for (const id in edgeEls) {
      const x = edgeEls[id];
      x.path.classList.remove("dim", "on", "now");
      x.lg.classList.remove("dim", "now");
      x.txt.textContent = x.base;
    }
    for (const id in nodeEls) nodeEls[id].classList.remove("dim", "on", "now");
    if (mode === "all") return;

    const p = paths[mode], cur = p.steps[step];
    const seen = new Set(p.steps.slice(0, step + 1).map(s => s.edge));
    for (const id in edgeEls) {
      const x = edgeEls[id];
      if (!pathEdges[mode].has(id)) { x.path.classList.add("dim"); x.lg.classList.add("dim"); }
      else if (id === cur.edge) { x.path.classList.add("now"); x.lg.classList.add("now"); if (cur.label) x.txt.textContent = cur.label; }
      else if (seen.has(id)) x.path.classList.add("on");
    }
    for (const id in nodeEls) {
      if (!pathNodes[mode].has(id)) nodeEls[id].classList.add("dim");
      else if (id === edges[cur.edge].from || id === edges[cur.edge].to) nodeEls[id].classList.add("now");
      else nodeEls[id].classList.add("on");
    }

    $("now-meta").textContent = `${p.name} · step ${step + 1} of ${p.steps.length}`;
    $("now-title").textContent = cur.title;
    $("now-text").textContent = cur.text;
    $("prev").disabled = step === 0;
    $("next").textContent = step === p.steps.length - 1 ? "Start again" : "Next";
    $("play").textContent = playing ? "Pause" : "Play";
    $("play").hidden = reduced;

    const list = $("steps");
    list.innerHTML = "";
    p.steps.forEach((s, i) => {
      const li = html("li", {}, list);
      const b = html("button", { className: "step" + (i < step ? " done" : ""), id: `step-${mode}-${i}`, textContent: s.title }, li);
      if (i === step) b.setAttribute("aria-current", "step");
      b.addEventListener("click", () => go(i, false));
    });
  }

  function select(id) {
    mode = id; step = 0; playing = !reduced; stepStart = performance.now();
    try { history.replaceState(null, "", id === "all" ? location.pathname : `#${id}`); } catch (_) {}
    paint();
  }
  function go(i, keepPlaying) {
    const n = paths[mode].steps.length;
    step = (i + n) % n; stepStart = performance.now();
    if (!keepPlaying) playing = false;
    paint();
  }

  $("prev").addEventListener("click", () => go(step - 1, false));
  $("next").addEventListener("click", () => go(step + 1, false));
  $("play").addEventListener("click", () => { playing = !playing; stepStart = performance.now(); paint(); });
  document.addEventListener("keydown", ev => {
    if (mode === "all" || ev.target.closest("input, textarea")) return;
    if (ev.key === "ArrowRight") go(step + 1, false);
    if (ev.key === "ArrowLeft") go(step - 1, false);
  });

  // Comets: a bright head with a fading tail, drawn along an edge.
  const pool = [];
  function comet(i) {
    if (!pool[i]) {
      const g = el("g", { class: "comet" }, $("comets"));
      const parts = [];
      for (let j = 0; j < 7; j++) parts.push(el("circle", { r: 4.6 - j * 0.55 }, g));
      pool[i] = { g, parts };
    }
    return pool[i];
  }
  function drawComet(c, edgeId, t, color, strength) {
    const x = edgeEls[edgeId];
    // No motion on a line dimmed behind an open detail card.
    if (x.path.classList.contains("fdim")) { c.g.style.display = "none"; return; }
    c.g.style.display = "";
    c.parts.forEach((pt, j) => {
      const tt = Math.max(0, Math.min(1, t - j * 0.035));
      const p = x.path.getPointAtLength(tt * x.len);
      pt.setAttribute("cx", p.x); pt.setAttribute("cy", p.y);
      pt.setAttribute("fill", color);
      pt.setAttribute("opacity", ((1 - j / 7) * strength).toFixed(3));
    });
  }
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // In All, each path runs its steps in order on its own loop, in its own colour.
  const allOrder = [];
  for (const id in paths) paths[id].steps.forEach((s, i) => allOrder.push({ id, edge: s.edge, i, n: paths[id].steps.length }));

  function frame(now) {
    let used = 0;
    if (!reduced) {
      if (mode === "all") {
        const colors = {};
        for (const id in paths) colors[id] = colorOf(id);
        for (const it of allOrder) {
          const local = (now % (it.n * 900 + 1200)) - it.i * 900;
          if (local < 0 || local > TRAVEL_MS) continue;
          drawComet(comet(used++), it.edge, ease(local / TRAVEL_MS), colors[it.id], 0.95);
        }
      } else {
        const elapsed = now - stepStart;
        const t = (elapsed % 2100) / TRAVEL_MS;
        if (t <= 1) drawComet(comet(used++), paths[mode].steps[step].edge, ease(t), colorOf(mode), 1);
        if (playing && elapsed > STEP_MS) go(step + 1, true);
      }
    }
    for (let i = used; i < pool.length; i++) pool[i].g.style.display = "none";
    requestAnimationFrame(frame);
  }

  // Theme: follows the system until the reader picks one, then remembers it for this page.
  const themeKey = `flow-paths-theme:${spec.title}`;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches;
  const themeBtn = $("theme");
  const labelTheme = () => {
    themeBtn.setAttribute("aria-pressed", String(isDark()));
    $("theme-label").textContent = isDark() ? "Dark" : "Light";
  };
  try { const saved = localStorage.getItem(themeKey); if (saved === "light" || saved === "dark") root.dataset.theme = saved; } catch (_) {}
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem(themeKey, next); } catch (_) {}
    labelTheme();
  });
  sysDark.addEventListener("change", labelTheme);
  labelTheme();

  // Presenting: full screen where the browser allows it; the layout change alone works anywhere.
  const presentBtn = $("present");
  let usedFullscreen = false;
  const setPresenting = on => {
    root.classList.toggle("presenting", on);
    presentBtn.setAttribute("aria-pressed", String(on));
    $("present-label").textContent = on ? "Exit" : "Present";
  };
  const togglePresenting = () => {
    const on = !root.classList.contains("presenting");
    setPresenting(on);
    if (on && root.requestFullscreen) {
      root.requestFullscreen().then(() => { usedFullscreen = true; }).catch(() => {});
    } else if (!on && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  };
  presentBtn.addEventListener("click", togglePresenting);
  // Leaving full screen with the browser's own Esc also ends presenting.
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && usedFullscreen) { usedFullscreen = false; setPresenting(false); }
  });
  document.addEventListener("keydown", ev => {
    if (ev.target.closest("input, textarea") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "f" || ev.key === "F") togglePresenting();
    if (ev.key === "Escape" && root.classList.contains("presenting") && !document.fullscreenElement) setPresenting(false);
  });
  // Detail card: what a box is, what it is connected to, and which paths use it.
  const kindLabel = {};
  for (const k in kinds) kindLabel[k] = kinds[k].label;
  const stage = document.querySelector(".stage");
  const passport = $("passport");
  let focused = null, framed = [];
  // Where the reader dragged the card, relative to the visible part of the diagram; kept while the page is open.
  let cardAt = null;

  const home = svg.getAttribute("viewBox").split(/[ ,]+/).map(Number);
  let view = home.slice(), camera = 0;
  // A view that is not four finite numbers, with a positive size, would collapse the drawing; it is skipped.
  const setView = v => {
    if (!v.every(Number.isFinite) || v[2] <= 0 || v[3] <= 0) return;
    view = v; svg.setAttribute("viewBox", v.map(n => n.toFixed(1)).join(" "));
  };
  function moveCamera(target) {
    cancelAnimationFrame(camera);
    if (reduced) { setView(target); return; }
    const from = view.slice(), MS = 450;
    let t0 = null;
    const step = now => {
      if (t0 === null) t0 = now;
      const t = Math.min(1, (now - t0) / MS), k = ease(t);
      setView(from.map((v, i) => v + (target[i] - v) * k));
      if (t < 1) camera = requestAnimationFrame(step);
    };
    camera = requestAnimationFrame(step);
  }

  // The view that fits the given boxes into the part of the diagram the card does not cover.
  function viewFor(ids) {
    const xs = ids.map(i => nodes[i].x), ys = ids.map(i => nodes[i].y), pad = 46;
    const minX = Math.min(...xs) - W / 2 - pad, maxX = Math.max(...xs) + W / 2 + pad;
    const minY = Math.min(...ys) - H / 2 - pad, maxY = Math.max(...ys) + H / 2 + pad;
    // The drawing keeps the diagram's proportions inside the element, centred if the element is wider or taller.
    const aspect = home[2] / home[3];
    const box = svg.getBoundingClientRect();
    const rw = Math.min(box.width, box.height * aspect), rh = rw / aspect;
    const ox = (box.width - rw) / 2;
    const cardLeft = passport.offsetLeft - stage.scrollLeft - ox, cardRight = cardLeft + passport.offsetWidth;
    let coverL = 0, coverR = 0;
    if ((cardLeft + cardRight) / 2 < rw / 2) coverL = Math.max(0, cardRight + 16);
    else coverR = Math.max(0, rw - cardLeft + 16);
    const free = Math.max(rw * 0.3, rw - coverL - coverR);
    const scale = Math.min(free / (maxX - minX), rh / (maxY - minY), (rw / home[2]) * 2.2);
    const w = rw / scale, h = rh / scale;
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    return [cx - (coverL + free / 2) / scale, cy - h / 2, w, h];
  }

  function clearFocus() {
    if (!focused) return;
    nodeEls[focused].classList.remove("focus");
    document.querySelectorAll(".fdim").forEach(n => n.classList.remove("fdim"));
    passport.hidden = true;
    svg.classList.remove("focusing");
    focused = null;
    moveCamera(home);
  }

  function linkTo(parent, nodeId, label, arrow) {
    const b = document.createElement("button");
    b.className = "pp-link"; b.type = "button";
    b.append(`${arrow} ${nodes[nodeId].label}`);
    const sp = document.createElement("span"); sp.textContent = label; b.appendChild(sp);
    b.addEventListener("click", () => focusNode(nodeId));
    parent.appendChild(b);
  }

  function focusNode(id) {
    if (focused) {
      nodeEls[focused].classList.remove("focus");
      document.querySelectorAll(".fdim").forEach(n => n.classList.remove("fdim"));
    }
    focused = id;
    const n = nodes[id];
    const g = nodeEls[id];
    // Drawn last, so the highlighted box sits above its neighbours.
    g.parentNode.appendChild(g);
    g.classList.add("focus");
    svg.classList.add("focusing");

    // Keep the box, its neighbours and the edges between them; dim the rest.
    const keep = new Set([id]);
    for (const eid in edges) {
      const e = edges[eid];
      const touches = e.from === id || e.to === id;
      if (touches) { keep.add(e.from); keep.add(e.to); }
      else { edgeEls[eid].path.classList.add("fdim"); edgeEls[eid].lg.classList.add("fdim"); }
    }
    for (const nid in nodeEls) if (!keep.has(nid)) nodeEls[nid].classList.add("fdim");

    $("pp-kind").textContent = kindLabel[n.kind] || "";
    $("pp-title").textContent = n.label;
    $("pp-sub").textContent = n.sub || "";
    $("pp-desc").textContent = n.description || "";
    for (const [box, dir] of [["pp-in", "to"], ["pp-out", "from"]]) {
      const sec = $(box);
      sec.querySelectorAll(".pp-link").forEach(x => x.remove());
      const list = Object.values(edges).filter(e => e[dir] === id);
      list.forEach(e => linkTo(sec, dir === "to" ? e.from : e.to, e.label, dir === "to" ? "←" : "→"));
      sec.hidden = !list.length;
    }
    const chips = $("pp-chips");
    chips.innerHTML = "";
    const using = Object.keys(paths).filter(k => pathNodes[k].has(id));
    using.forEach(k => {
      const c = document.createElement("button");
      c.className = "pp-chip"; c.type = "button"; c.textContent = paths[k].name;
      c.style.setProperty("--c", `var(--p-${k})`);
      c.addEventListener("click", () => { clearFocus(); select(k); });
      chips.appendChild(c);
    });
    $("pp-paths").hidden = !using.length;

    // The card sits where the reader left it, or in the top-left corner; the camera frames the box beside it.
    passport.hidden = false;
    placeCard(cardAt ? cardAt.left : 12, cardAt ? cardAt.top : 12);
    framed = [...keep];
    moveCamera(viewFor(framed));
  }

  for (const id in nodeEls) {
    const g = nodeEls[id];
    g.addEventListener("click", ev => { ev.stopPropagation(); focused === id ? clearFocus() : focusNode(id); });
    g.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); focused === id ? clearFocus() : focusNode(id); }
    });
  }
  $("pp-close").addEventListener("click", clearFocus);

  // Kept inside the diagram's visible area.
  function placeCard(left, top) {
    const maxL = stage.clientWidth - passport.offsetWidth - 4, maxT = stage.clientHeight - passport.offsetHeight - 4;
    const l = Math.max(4, Math.min(left, maxL)), t = Math.max(4, Math.min(top, maxT));
    passport.style.left = `${stage.scrollLeft + l}px`;
    passport.style.top = `${t}px`;
    return { left: l, top: t };
  }
  const grip = $("pp-grip");
  grip.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    grip.setPointerCapture(ev.pointerId);
    passport.classList.add("dragging");
    const startX = ev.clientX, startY = ev.clientY;
    const startL = passport.offsetLeft - stage.scrollLeft, startT = passport.offsetTop;
    const move = e => { cardAt = placeCard(startL + e.clientX - startX, startT + e.clientY - startY); };
    const up = () => {
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", up);
      grip.removeEventListener("pointercancel", up);
      passport.classList.remove("dragging");
      if (focused) moveCamera(viewFor(framed));
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", up);
    grip.addEventListener("pointercancel", up);
  });
  svg.addEventListener("click", clearFocus);
  passport.addEventListener("click", ev => ev.stopPropagation());
  // Esc closes the card first; a second Esc then leaves presenting.
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && focused) { clearFocus(); ev.stopImmediatePropagation(); }
  }, true);
  window.addEventListener("resize", () => { if (focused) focusNode(focused); });
  // Presenting changes the diagram's size, so the camera is framed again.
  new MutationObserver(() => { if (focused) requestAnimationFrame(() => focusNode(focused)); })
    .observe(root, { attributes: true, attributeFilter: ["class"] });

  const start = (location.hash || "").slice(1);
  if (paths[start]) select(start); else paint();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
